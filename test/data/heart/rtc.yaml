- GEN:
    MODAL_CTRL: 0
    HO_POLC: 0
    LO_POLC: 0
- HO:
    RECONSTRUCTED_VECT_SIZE: 2
    WFS_COUNT: 1
    WFS_TYPE: 0
    WFS_SIZE: [{ WFS_NUM: 0, ROWS: 4, COLS: 4 }]
    SUBAP_TOTAL: [{ WFS_NUM: 0, NUM: 1 }]
    SHWFS_SUBAP_SIZE: [{ WFS_NUM: 0, ROWS: 4, COLS: 4 }]
    SHWFS_SUBAP_LOCATION_FILE: [{ WFS_NUM: 0, FILE: "subapertures.csv" }]
    WFS_HARDWARE: [
        { WFS_NUM: 0, DETECTOR_TYPE: 1, IS_GRAD: 0, CONNECTION_STR: "127.0.0.1:6000", FPS: 10.0, EXPOSURE_TIME: 100000.0, GAIN: 1.0, TRIG_TYPE: 0 }
    ]
    OPTICAL_GAIN_INITIAL: [{ WFS_NUM: 0, X: 1.0, Y: 1.0 }]
    GLOBAL_NORM_FLAG: 0
    FLUX_THRES_MANUAL: -1.0
    SUBAP_MASK_INITIAL_FILE: [{ WFS_NUM: 0, FILE: "mask.csv" }]
    SHWFS_GRAD_TYPE: 0
    RECON_TYPE: 0
    CONTROL_MAT_ROW_PARTITIONS: 1
    CONTROL_MAT_COL_PARTITIONS: 1
    CONTROL_MVM_STREAMING_INPUT: 0
- LO:
    RECONSTRUCTED_VECT_SIZE: 3
    WFS_COUNT: 0
- DM:
    VDM_COUNT: 1
    VDM_SIZES: [{ VDM_NUM: 0, SIZE: 2, SIZE_FULL: 2, NUM_OF_PDM: 1 }]
    PDM_COUNT: 1
    PDM_SIZES: [{ PDM_NUM: 0, SIZE: 2 }]
    PDM_DIAMETER: [{ PDM_NUM: 0, SIZE: 2 }]
    PDM_ACTUATOR_MAP_FILE: [{ PDM_NUM: 0, FILE: "actuators.csv" }]
    PDM_HARDWARE: [
        { PDM_NUM: 0, WC_TYPE: 1, CONNECTION_STR: "127.0.0.1:6100", SCALE_FACTOR: 1.0, BYTE_ORDER: 0 }
    ]
    TT_COUNT: 0
- TELOFF:
    TELOFF_COUNT: 0
- TFC:
    TFC_INIT_GAIN_FILTER: [{ HO: -0.5, LO: -0.5 }]
    TFC_LO_MODE_IN_HO: 0
    TFC_LO_MODE_APPEND_HO: 0
    TFC_SPLIT_TO_HO_LO: 0
    TFC_HO_TEMPORAL_FILTER: [{ EXISTS: 0, ORDER: 2, ZONAL_GAIN: 1.0 }]
    TFC_LO_TEMPORAL_FILTER: [{ EXISTS: 0, ORDER: 2 }]
    TFC_HO_NORM: 1.0
- CLWC:
    CLWC_DM_SCALAR: 1.0
    CLWC_DM_LEAK_PARAM: 1.0
...
