name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '1,1'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      JULIA_PKG_USE_CLI_GIT: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install dependencies and build the command receiver
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:
          julia --project --startup-file=no -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(url="https://github.com/DarrylGamroth/PackageRegistry.git")
            Pkg.instantiate()
            Pkg.build("AdaptiveOpticsSimPipeWireHIL")'
      - name: Run tests and Aqua
        run: julia --project --startup-file=no -e 'using Pkg; Pkg.test(coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext,deps
      - uses: actions/upload-artifact@v7
        with:
          name: julia-coverage
          path: lcov.info
          if-no-files-found: error

  codecov:
    name: Publish coverage to Codecov
    needs: test
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: julia-coverage
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          disable_file_fixes: true
          fail_ci_if_error: true
          use_oidc: true
